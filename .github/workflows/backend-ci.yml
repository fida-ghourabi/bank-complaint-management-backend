name: Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  INFRA_REPO: fida-ghourabi/bank-complaint-management-infra

jobs:

  build:
    name: Build and Publish Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 1. Checkout backend
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      # 3. Restore
      - name: Restore dependencies
        run: dotnet restore BankComplaintManagement.sln

      # 4. Build
      - name: Build
        run: dotnet build BankComplaintManagement.sln --configuration Release --no-restore

      # 5. Login to GHCR
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            

      # 7. Push Docker image
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 8. Checkout infrastructure repository
      - name: Checkout infrastructure repository
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      # 9. Update Kubernetes image
      - name: Update backend image
        if: github.event_name == 'push'
        run: |
          cd infra

          sed -i \
            "s|image: ghcr.io/fida-ghourabi/bank-complaint-management-backend:.*|image: ghcr.io/fida-ghourabi/bank-complaint-management-backend:${{ github.sha }}|" \
            k8s/api/deployment.yaml

          echo "Updated backend image:"
          grep "image: ghcr.io/fida-ghourabi/bank-complaint-management-backend" \
            k8s/api/deployment.yaml

      # 10. Commit and push infrastructure change
      - name: Commit and push infrastructure change
        if: github.event_name == 'push'
        run: |
          cd infra

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/api/deployment.yaml

          git commit \
            -m "chore: update backend image to ${{ github.sha }}" \
            || echo "No changes to commit"

          git push
